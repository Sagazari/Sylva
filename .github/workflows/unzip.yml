name: Extrair zip

on:
  push:
    paths:
      - 'BypeCityStaff.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip
        run: |
          rm -rf BypeCityStaff
          unzip -o BypeCityStaff.zip

      - name: Commitar os arquivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A BypeCityStaff
          git diff --cached --quiet || (git commit -m "Extrai BypeCityStaff.zip" && git push)
